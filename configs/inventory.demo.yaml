  - { prefix: "2001:db8:1::10/128", country_code: DE, country_name: Germany, city: Frankfurt, latitude: 50.11, longitude: 8.68, asn: 13335, organization: Cloudflare }
  - { prefix: 203.0.113.20/32, country_code: JP, country_name: Japan, city: Tokyo, latitude: 35.68, longitude: 139.69, asn: 15169, organization: Google }
  - { prefix: 203.0.113.21/32, country_code: US, country_name: United States, city: Council Bluffs, latitude: 41.26, longitude: -95.86, asn: 15169, organization: Google }
