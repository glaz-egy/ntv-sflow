services:
  # Web UI. WEB_DATA_MODE=mock (default): data generated in the browser.
  #         WEB_DATA_MODE=api: data from the `api` service (start both).
  #   docker compose -f deploy/docker-compose.dev.yml up --build web
  #   WEB_DATA_MODE=api docker compose -f deploy/docker-compose.dev.yml up --build web api
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_DATA_MODE: ${WEB_DATA_MODE:-mock}
        # Reached by the *browser*, so it must be a host-visible URL.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8080}
        NEXT_PUBLIC_MOCK_SEED: ${MOCK_SEED:-42}
        NEXT_PUBLIC_MOCK_SCENARIO: ${MOCK_SCENARIO:-default}
        NEXT_PUBLIC_MOCK_SPEED: ${MOCK_SPEED:-1}
    image: ntv-web:dev
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

  # Go REST + WebSocket API (mock mode). MOCK_* are read at runtime: no rebuild needed.
  api:
    build: &go-build
      context: ..
      dockerfile: Dockerfile.backend
    image: ntv-go:dev
    command: ["ntv-api"]
    environment:
      MOCK_SCENARIO: ${MOCK_SCENARIO:-default}
      MOCK_SEED: ${MOCK_SEED:-42}
      MOCK_SPEED: ${MOCK_SPEED:-1}
      API_CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
    restart: unless-stopped

  # Live mode: API + embedded sFlow collector (D-053). Exporters → <host>:6343/udp.
  #   docker compose -f deploy/docker-compose.dev.yml --profile live up --build -d api-live
  # Demo without hardware (inventory matching the generator):
  #   INVENTORY_FILE=/etc/ntv/inventory.demo.yaml SFLOW_TARGET=api-live:6343 \
  #     docker compose -f deploy/docker-compose.dev.yml --profile live --profile demo up --build -d api-live sflow-gen
  # Your own inventory: put it in ./configs and set INVENTORY_FILE=/etc/ntv/custom/<file>.yaml
  # GeoIP: put GeoLite2-City.mmdb / GeoLite2-ASN.mmdb in ./data (optional).
  api-live:
    build: *go-build
    image: ntv-go:dev
    profiles: ["live"]
    command: ["ntv-api"]
    environment:
      APP_MODE: live
      INVENTORY_FILE: ${INVENTORY_FILE:-}
      COLLECTOR_LISTEN: 0.0.0.0:6343
      COLLECTOR_ALLOWED_SOURCES: ${COLLECTOR_ALLOWED_SOURCES:-}
      GEOIP_CITY_DB: /data/GeoLite2-City.mmdb
      GEOIP_ASN_DB: /data/GeoLite2-ASN.mmdb
      API_CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3000}
    volumes:
      - ../configs:/etc/ntv/custom:ro
      - ../data:/data:ro
    ports:
      - "${API_PORT:-8080}:8080"
      - "${COLLECTOR_PORT:-6343}:6343/udp"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
    restart: unless-stopped

  # Standalone sFlow v5 collector (logs + metrics only; no API). Point exporters at <host>:6343/udp.
  #   docker compose -f deploy/docker-compose.dev.yml up --build -d collector
  collector:
    build: *go-build
    image: ntv-go:dev
    command: ["ntv-collector"]
    environment:
      COLLECTOR_LISTEN: 0.0.0.0:6343
      COLLECTOR_METRICS_LISTEN: 0.0.0.0:9102
      COLLECTOR_ALLOWED_SOURCES: ${COLLECTOR_ALLOWED_SOURCES:-}
      COLLECTOR_DEBUG_FLOWS_PER_SECOND: ${COLLECTOR_DEBUG_FLOWS_PER_SECOND:-0}
    ports:
      - "${COLLECTOR_PORT:-6343}:6343/udp"
      - "${COLLECTOR_METRICS_PORT:-9102}:9102"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9102/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
    restart: unless-stopped

  # Demo exporter: sends sFlow generated from the mock to the collector.
  #   docker compose -f deploy/docker-compose.dev.yml --profile demo up --build -d collector sflow-gen
  sflow-gen:
    build: *go-build
    image: ntv-go:dev
    profiles: ["demo"]
    command: ["ntv-sflow-gen", "-target", "${SFLOW_TARGET:-collector:6343}", "-scenario", "${MOCK_SCENARIO:-default}", "-seed", "${MOCK_SEED:-42}"]
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ntv
      POSTGRES_PASSWORD: ntv
      POSTGRES_DB: ntv
    ports:
      - "5432:5432"
    volumes:
      - ntv_postgres:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ntv_clickhouse:/var/lib/clickhouse

  redis:
    image: redis:7
    profiles: ["redis"]
    ports:
      - "6379:6379"

volumes:
  ntv_postgres:
  ntv_clickhouse:
