# Demo exporter (cmd/sflow-gen). Not for production use.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntv-sflow-gen
  labels:
    app.kubernetes.io/name: ntv-sflow-gen
    app.kubernetes.io/component: demo
spec:
  replicas: 1 # more replicas would duplicate the same simulated exporters
  selector:
    matchLabels:
      app.kubernetes.io/name: ntv-sflow-gen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntv-sflow-gen
        app.kubernetes.io/component: demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sflow-gen
          image: ntv-go
          command: ["ntv-sflow-gen", "-target", "ntv-sflow:6343", "-scenario", "default", "-seed", "42"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
